spring.application.name=estoque-pedidos
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/estoque}
spring.datasource.username=${DB_USER:portfolio}
spring.datasource.password=${DB_PASSWORD:portfolio}
spring.flyway.enabled=true
spring.jackson.serialization.write-dates-as-timestamps=false
server.error.include-message=always
